name: CI
on:
  push:
    branches:
      - main
      - develop
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: all builds except for main, develop and tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Avoid CondaPkg/pixi network downloads during PythonCall initialization by using the runner's system Python.
      JULIA_PYTHONCALL_EXE: python
    permissions: # needed to allow julia-actions/cache to delete old caches
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10' # Current LTS
          - '1'    # Latest stable
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        # Note: no 32-bit (x86) job. PythonCall is a test dependency and loads
        # libpython into the Julia process, so it needs an arch/pointer-width
        # matched Python; none exists for 32-bit Julia, which makes the test
        # environment's PythonCallExt precompilation fail on x86.
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # Enable the optional PythonCall integration tests (pandas/polars tables
      # must NOT pop a browser). PythonCall loads libpython into the Julia
      # process, so the Python must match Julia's CPU arch and pointer width.
      # We therefore run them only on native x64 Linux: x86 is 32-bit, and the
      # macOS runner is arm64 while this matrix builds x64 (Rosetta) Julia.
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        id: setup-python
        with:
          python-version: '3.13'
      - name: Install Python deps for PythonCall integration tests
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        run: python -m pip install --upgrade pip pandas polars
      - name: Enable PythonCall integration tests
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        run: |
          echo "ZEDPLOTPANE_TEST_PYTHON=true" >> "$GITHUB_ENV"
          echo "JULIA_CONDAPKG_BACKEND=Null" >> "$GITHUB_ENV"
          echo "JULIA_PYTHONCALL_EXE=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
